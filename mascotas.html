<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mascotas - VetConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html">

                VetConnect

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html">

                            Inicio

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="mascotas.html">

                            Mascotas

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="contacto.html">

                            Contacto

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="login.html">

                            Iniciar sesión

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTENIDO -->

    <main>

        <div class="container mt-5">

            <h2 class="mb-4">
                Mascotas registradas
            </h2>

            <div class="alert alert-success">
              Mascota registrada correctamente.
            </div>
            
          <button
            class="btn btn-primary mb-4"
            data-bs-toggle="modal"
            data-bs-target="#modalMascota">
            
            Nueva mascota
          </button>

          <div
          class="modal fade"
          id="modalMascota">
          <div class="modal-dialog">
            
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">
                  Nueva mascota
                </h5>
                button
                class="btn-close"
                data-bs-dismiss="modal">
              </button>
            </div>


            <div class="modal-body">

                <form>

                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="nombreMascota">

                            Nombre

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombreMascota">

                    </div>


                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="especie">

                            Especie

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="especie">

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Guardar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

            <div class="table-responsive">

                <table class="table table-striped">

                    <thead>

                        <tr>

                            <th>Nombre</th>

                            <th>Especie</th>

                            <th>Edad</th>

                            <th>Estado</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr>

                            <td>Firulais</td>

                            <td>Perro</td>

                            <td>5</td>

                            <td>

                                <span class="badge bg-success">
                                    Activo
                                </span>

                            </td>

                        </tr>


                        <tr>

                            <td>Michi</td>

                            <td>Gato</td>

                            <td>3</td>

                            <td>

                                <span class="badge bg-success">
                                    Activo
                                </span>

                            </td>

                        </tr>


                        <tr>

                            <td>Luna</td>

                            <td>Perro</td>

                            <td>2</td>

                            <td>

                                <span class="badge bg-warning text-dark">
                                    Pendiente
                                </span>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
